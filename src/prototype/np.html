<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#MIC mock · Music Industry Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#FEFDFC; --surface:#FAFAF9; --card:#FFFFFF;
    --foreground:#0D0D0D; --ink:#060606; --ink-soft:#1B1B1B;
    --muted:#F2F2EF; --muted-foreground:#646360;
    --line:#E5E4E2; --ring:#8FA0B8;
    --pop:#F51D31; --hero-dark:#0B0B0B; --footer:#050505;
    --up:#16A34A; --rising:#2563EB; --stable:#9CA3AF; --down:#EA580C;
    --amber:#B45309; --emerald:#047857;
    --accent:#C8102E;
    --radius:16px; --radius-card:26px;
    --font:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --shadow-hover:0 24px 70px -28px rgba(0,0,0,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--background);color:var(--foreground);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .np-proto{display:flex;flex-direction:column;min-height:100vh}
  .np-proto > main#app{flex:1;display:flex;flex-direction:column}
  .np-proto > footer.site{margin-top:auto;background:var(--footer);color:rgba(255,255,255,.7)}
  a{color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}

  /* ---------- Animations ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .rv{opacity:0}
  .rv.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  @media (prefers-reduced-motion: reduce){.rv{opacity:1}.rv.in{animation:none}}

  /* ---------- Header ---------- */
  header.site{position:sticky;top:0;z-index:60;height:64px;background:rgba(254,253,252,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  header.site .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;background:var(--ink);border-radius:9999px;padding:8px 14px;transition:transform .2s, box-shadow .2s}
  .brand:hover{transform:translateY(-1px);box-shadow:0 10px 28px -12px rgba(0,0,0,.35)}
  .brand .logo-mic{height:22px;width:auto;display:block}
  .brand .sub{display:none}
  nav.main{display:flex;gap:26px;align-items:center}
  nav.main a{font-size:13.5px;font-weight:600;color:var(--muted-foreground);text-decoration:none;padding:7px 14px;border:1px solid transparent;border-radius:9999px;display:flex;align-items:center;gap:7px;transition:color .2s, border-color .2s, background .2s}
  nav.main a:hover{color:var(--ink);background:var(--muted)}
  nav.main a.active{color:var(--ink);border-color:var(--pop);background:rgba(200,16,46,.05)}
  nav.main .count{background:var(--pop);color:#fff;font-size:10px;font-weight:700;border-radius:9999px;padding:1px 6px}
  nav.main .p2{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted-foreground);border:1px solid var(--line);border-radius:9999px;padding:2px 7px}
  .hdr-actions{display:flex;align-items:center;gap:12px}
  .search-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9999px;padding:8px 14px;font-size:13px;color:#A9A7A3;background:var(--card);cursor:pointer;min-width:190px;transition:border-color .2s, box-shadow .2s}
  .search-pill:hover{border-color:#cfcecb;box-shadow:0 6px 20px -12px rgba(0,0,0,.2)}
  .search-pill kbd{margin-left:auto;font-family:var(--font);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted-foreground)}
  .avatar-mc{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* ---------- Photos duotone ---------- */
  .ph{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc,var(--accent)) 0%,#0B0B0B 80%)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:luminosity;opacity:.88;filter:contrast(1.05);transition:transform .7s cubic-bezier(.2,.7,.2,1), opacity .4s}
  .ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.42) 100%);pointer-events:none}
  .ph .chip-on{position:absolute;z-index:2}

  /* ---------- Générique ---------- */
  .kicker{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
  .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--pop);display:inline-block;flex:none}
  .display{font-weight:800;letter-spacing:-.045em;line-height:.94}
  .display em{font-style:italic;color:#B9B7B3;font-weight:800}
  .h-sect{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.03em;margin:0 0 4px;display:flex;align-items:baseline;gap:12px}
  .h-sect small{font-size:12px;font-weight:600;color:var(--muted-foreground);letter-spacing:0}
  .h-sub{font-size:13.5px;color:var(--muted-foreground);margin-bottom:20px;max-width:640px}
  section.band{padding:52px 0}
  .band.dark{background:#000;color:#fff}
  .band.dark .kicker{color:rgba(255,255,255,.55)}
  .band.dark p.lead{color:rgba(255,255,255,.65)}
  p.lead{color:var(--muted-foreground);max-width:600px;font-size:15.5px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:28px;transition:box-shadow .3s, transform .3s}
  .card.hov:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
  .card .kicker{margin-bottom:4px}
  .grid{display:grid;gap:18px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .g-main{grid-template-columns:1.9fr 1fr;align-items:start}
  @media(max-width:960px){.g2,.g3,.g4,.g-main{grid-template-columns:1fr}}
  .num-xl{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .num-lg{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}

  /* Boutons */
  .btn{display:inline-flex;align-items:center;gap:9px;border-radius:9999px;font-size:14px;font-weight:600;height:46px;padding:0 22px;border:0;cursor:pointer;font-family:var(--font);text-decoration:none;transition:transform .2s, box-shadow .2s, background .2s}
  .btn .ar{display:inline-block;transition:transform .25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -14px rgba(0,0,0,.35)}
  .btn:hover .ar{transform:translate(3px,-3px)}
  .btn-dark{background:var(--ink);color:#FCFCFC}
  .btn-light{background:#fff;color:#000}
  .btn-outline{background:transparent;color:var(--foreground);border:1px solid var(--line)}
  .btn-outline:hover{border-color:var(--ink)}
  .btn-outline-w{background:transparent;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.2)}
  .btn-outline-w:hover{border-color:#fff;color:#fff}
  .btn-sm{height:36px;font-size:12.5px;padding:0 16px}
  .chip{height:38px;padding:0 18px;border-radius:9999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted-foreground);cursor:pointer;font-family:var(--font);transition:all .25s}
  .chip:hover{color:var(--ink);border-color:#bfbebb;transform:translateY(-1px)}
  .chip.active{background:var(--ink);color:#FCFCFC;border-color:var(--ink)}
  .chip-sm{height:32px;padding:0 14px;font-size:11.5px}
  .chip-ico{display:inline-flex;align-items:center;gap:8px;padding-left:7px}
  .chip .ic{width:14px;height:14px;flex:none;opacity:.9}
  .chip .fl{width:18px;height:12px;opacity:1;filter:none}
  .dsp-badge{width:20px;height:20px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  .dsp-badge svg{width:13px;height:13px;display:block}
  .chip.active .dsp-badge{box-shadow:0 0 0 1px rgba(255,255,255,.22)}
  .group-label{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground)}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:9999px;padding:5px 11px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .b-up{background:rgba(22,163,74,.09);color:var(--up)}
  .b-rising{background:rgba(37,99,235,.09);color:var(--rising)}
  .b-stable{background:rgba(156,163,175,.13);color:#6B7280}
  .b-down{background:rgba(234,88,12,.09);color:var(--down)}
  .b-manual{background:var(--muted);color:var(--muted-foreground);border:1px solid var(--line)}
  .b-accent{background:color-mix(in srgb, var(--accent) 9%, transparent);color:var(--accent)}
  .b-outline-green{background:#ECFDF5;color:var(--emerald);border:1px solid #A7F3D0}
  .delta{font-weight:700;font-size:14px}
  .delta.pos{color:var(--up)}.delta.neg{color:var(--down)}.delta.flat{color:var(--stable)}

  /* KPI band gros chiffres bold */
  .kpi-band{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--card)}
  .kpi{padding:30px 40px;border-left:1px solid var(--line);transition:background .25s}
  .kpi:hover{background:var(--surface)}
  .kpi:first-child{border-left:none}
  .kpi .lab{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .val{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .kpi .cmp{font-size:12.5px;font-weight:600}
  @media(max-width:960px){.kpi-band{grid-template-columns:1fr 1fr}.kpi{padding:20px 24px}.kpi .val{font-size:26px}}
  /* Bandeau KPI flottant : carte arrondie avec ombre, chevauchant le hero */
  .kpi-float{max-width:1176px;margin:-44px auto 26px;border-radius:26px;border:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 24px 60px -24px rgba(11,11,11,.28),0 2px 6px rgba(11,11,11,.05);overflow:hidden;position:relative;z-index:3}
  .kpi-float .kpi:first-child{border-left:none}
  @media(max-width:960px){.kpi-float{margin:-28px 14px 20px;max-width:none;border-radius:20px}.kpi-float .kpi:nth-child(-n+2){border-top:none}.kpi-float .kpi:nth-child(odd){border-left:none}.kpi-float .kpi:nth-child(n+3){border-top:1px solid var(--line)}}


  /* Sous-navigation sticky (dashboard artiste) */
  .subnav{position:sticky;top:64px;z-index:50;background:rgba(254,253,252,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .subnav .wrap{display:flex;gap:6px;align-items:center;padding:10px 32px;overflow-x:auto;scrollbar-width:none}
  .subnav .wrap::-webkit-scrollbar{display:none}
  .subnav a{font-size:12.5px;font-weight:600;color:var(--muted-foreground);text-decoration:none;padding:8px 14px;border-radius:9999px;white-space:nowrap;transition:all .2s}
  .subnav a:hover{color:var(--ink);background:var(--muted)}
  .subnav a.on{background:var(--ink);color:#fff}
  .subnav .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
  .sync{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sync .ok{width:6px;height:6px;border-radius:50%;background:var(--up)}
  .sync .warn{width:6px;height:6px;border-radius:50%;background:var(--amber)}

  /* Filtres */
  .filters{border-bottom:1px solid var(--line);background:var(--background)}
  .filters .wrap{display:flex;align-items:center;gap:10px;padding:14px 32px;flex-wrap:wrap}
  .filters .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .filters .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .filters .chip.active{box-shadow:0 1px 0 rgba(0,0,0,.06)}
  .dsp-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .dsp-inline .group-label{margin-right:2px}
  @media(max-width:760px){ .dsp-inline{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:14px} .dsp-inline::-webkit-scrollbar{display:none} .dsp-inline .chip{flex:none} }
  .af-reset{border-style:dashed}
  .af-scope{border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--accent) 5%, var(--background))}
  .af-scope .wrap{display:flex;align-items:center;gap:8px;padding:10px 32px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
  .af-scope b{color:var(--foreground);font-weight:700}
  .af-scope .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  .af-scope .af-note{margin-left:auto;font-size:11.5px;opacity:.85}
  @media(max-width:760px){ .af-scope .af-note{margin-left:0;width:100%} }

  /* Tables */
  table.data{width:100%;border-collapse:collapse;font-size:14px}
  table.data th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.data td{padding:15px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.data tr:last-child td{border-bottom:none}
  table.data td.num, table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer;transition:background .2s}
  tr.click td:first-child{position:relative}
  tr.click td:first-child:before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--accent);opacity:0;transition:opacity .2s}
  tr.click:hover{background:var(--surface)}
  tr.click:hover td:first-child:before{opacity:1}
  .cell-title b{font-size:15.5px;font-weight:700;display:block;letter-spacing:-.01em}
  .cell-title span{font-size:11.5px;color:var(--muted-foreground)}
  .row-flex{display:flex;align-items:center;gap:14px}
  .cover-ph{width:48px;height:48px;border-radius:11px;flex:none;position:relative;overflow:hidden}
  .cover-ph img{transition:transform .5s}
  tr.click:hover .cover-ph img{transform:scale(1.12)}

  /* Tuiles stat chiffres bold */
  .tile{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;background:var(--card);transition:box-shadow .25s, transform .25s}
  .tile:hover{box-shadow:0 14px 40px -20px rgba(0,0,0,.22);transform:translateY(-2px)}
  .tile .lab{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:8px}
  .tile .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .tile .cmp{font-size:12px;margin-top:6px}

  /* Barres */
  .track{height:7px;border-radius:9999px;background:#F0EFED;overflow:hidden}
  .fill{display:block;height:100%;border-radius:9999px;background:var(--accent);transition:width .8s cubic-bezier(.2,.7,.2,1)}
  .brow{margin-bottom:13px}
  .btop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .btop b{font-weight:600}
  .btop span{color:var(--muted-foreground);font-variant-numeric:tabular-nums}

  /* Hero artiste avec photo */
  .a-hero{color:#fff;background:linear-gradient(135deg,var(--accent) 0%,#0B0B0B 72%)}
  .a-hero .wrap{padding:46px 32px 70px;display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
  @media(max-width:960px){.a-hero .wrap{grid-template-columns:1fr}}
  .a-hero .back{font-size:10px;font-weight:600;letter-spacing:.22em;color:rgba(255,255,255,.6);text-decoration:none;transition:color .2s}
  .a-hero .back:hover{color:#fff}
  .a-hero .meta{font-size:10px;font-weight:600;letter-spacing:.22em;color:rgba(255,255,255,.55);margin:20px 0 10px;text-transform:uppercase}
  .a-hero h1{font-size:clamp(48px,7vw,92px);font-weight:800;letter-spacing:-.045em;line-height:.92}
  .a-hero p{color:rgba(255,255,255,.72);font-size:15px;max-width:460px;margin-top:14px}
  .a-hero .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .a-hero .ph{border-radius:var(--radius-card);aspect-ratio:1/1;max-height:400px;width:100%;box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
  .a-hero .ph:hover img{transform:scale(1.045)}
  .hero-collage{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hero-collage .ph{border-radius:var(--radius-card);aspect-ratio:1/1;width:100%;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);display:block}
  .hero-collage .ph:hover img{transform:scale(1.06)}
  .track-chip{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;border-radius:9999px;padding:7px 14px;font-size:10.5px;font-weight:700;letter-spacing:.14em;display:flex;align-items:center;gap:7px}
  .track-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--pop)}

  /* Cards artistes (accueil) */
  .artist-card{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--card);overflow:hidden;cursor:pointer;transition:box-shadow .35s, transform .35s;text-decoration:none;display:block}
  .artist-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-5px)}
  .artist-card .ph{height:230px}
  .artist-card:hover .ph img{transform:scale(1.07)}
  .artist-card .lbl{position:absolute;top:14px;left:14px;z-index:2;background:rgba(0,0,0,.5);color:#fff;font-size:9px;font-weight:700;letter-spacing:.15em;border-radius:9999px;padding:5px 11px;backdrop-filter:blur(6px)}
  .artist-card .nm{position:absolute;left:18px;right:18px;bottom:14px;z-index:2;color:#fff;font-size:24px;font-weight:800;letter-spacing:-.025em;display:flex;justify-content:space-between;align-items:center}
  .artist-card .nm .ar{transition:transform .3s;font-size:16px;opacity:.8}
  .artist-card:hover .nm .ar{transform:translate(4px,-4px);opacity:1}
  .artist-card .body{padding:16px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .artist-card .meta{font-size:12.5px;color:var(--muted-foreground)}
  .artist-card .st{text-align:right}
  .artist-card .st b{font-size:20px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
  .artist-card .st span{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

  /* Hero accueil stack photos inclinées */
  .stack{position:relative;height:420px}
  .stack .ph{position:absolute;border-radius:22px;box-shadow:0 40px 80px -20px rgba(0,0,0,.55);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .stack .s1{width:62%;aspect-ratio:.9;right:6%;top:0;transform:rotate(4deg);z-index:2}
  .stack .s2{width:48%;aspect-ratio:.9;left:2%;bottom:0;transform:rotate(-7deg);z-index:1;opacity:.9}
  .stack:hover .s1{transform:rotate(2deg) translateY(-8px)}
  .stack:hover .s2{transform:rotate(-9deg) translateY(6px)}
  @media(max-width:960px){.stack{display:none}}

  /* Alertes */
  .alert-item{display:flex;gap:16px;padding:20px 24px;border:1px solid var(--line);border-radius:20px;background:var(--card);align-items:center;transition:box-shadow .25s, transform .25s}
  .alert-item:hover{box-shadow:0 16px 45px -22px rgba(0,0,0,.22);transform:translateX(4px)}
  .a-vign{position:relative;flex:none;display:block;width:48px;height:48px}
  .a-vign .cover-ph{width:48px;height:48px;border-radius:12px}
  .a-vign i{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
  .alert-item .cover-ph img{mix-blend-mode:normal;opacity:1;filter:none}
  .alert-item:hover .a-vign img{transform:scale(1.1)}
  .a-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;font-weight:700}
  .alert-item .cat-lab{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
  .alert-item p{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
  .alert-item .rule{font-size:11px;color:var(--muted-foreground);margin-top:4px;font-family:var(--mono)}
  .alert-item time{font-size:11.5px;color:var(--muted-foreground);flex:none}
  .al-act{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}

  /* Formulaires */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:7px}
  .field input,.field select{width:100%;font-family:var(--font);font-size:14px;color:var(--foreground);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;outline:none;transition:border-color .2s, box-shadow .2s}
  .field input:focus,.field select:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(143,160,184,.15)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:700px){.fgrid{grid-template-columns:1fr}}

  svg text{font-family:var(--font)}
  .spark-label{font-size:10.5px;fill:var(--muted-foreground)}

  /* Toast / modal */
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;border-radius:9999px;padding:13px 24px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.7,.2,1);z-index:100;display:flex;gap:10px;align-items:center;box-shadow:0 20px 50px -15px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
  #overlay.show{display:flex}
  .modal{width:460px;max-width:92vw;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 40px 120px -20px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,.7,.2,1)}
  .modal .m-head{padding:18px 24px;border-bottom:1px solid var(--line)}
  .modal .m-head .lab{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:3px}
  .modal .m-head b{font-size:16px;letter-spacing:-.01em}
  .modal .m-body{padding:20px 24px}
  .modal .opt{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:15px 17px;cursor:pointer;margin-bottom:10px;transition:border-color .2s, transform .2s}
  .modal .opt:hover{border-color:var(--ink);transform:translateX(3px)}
  .modal .opt .ic{width:38px;height:38px;border-radius:11px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .modal .opt b{font-size:14px;display:block}
  .modal .opt span{font-size:12px;color:var(--muted-foreground)}
  .modal input.srch{width:100%;border:0;outline:0;font-family:var(--font);font-size:15px;padding:17px 22px;border-bottom:1px solid var(--line)}
  .modal .grp{font-size:11px;font-weight:600;color:var(--muted-foreground);padding:12px 22px 4px}
  .modal .srow{display:flex;gap:13px;align-items:center;padding:10px 22px;cursor:pointer;transition:background .15s}
  .modal .srow:hover{background:var(--surface)}
  .modal .srow b{font-size:14px;display:block}
  .modal .srow span{font-size:12px;color:var(--muted-foreground)}
  .srow .cover-ph{width:38px;height:38px;border-radius:9px}

  /* ---------- Leaderboards ---------- */
  .lb{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--card);overflow:hidden}
  .lb-row{display:grid;align-items:center;gap:18px;padding:18px 26px;cursor:pointer;transition:background .2s;position:relative;text-decoration:none;color:inherit}
  .lb-row + .lb-row{border-top:1px solid var(--line)}
  .lb-row:before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:4px;border-radius:0 4px 4px 0;background:var(--acc,var(--accent));opacity:0;transition:opacity .2s}
  .lb-row:hover{background:var(--surface)}
  .lb-row:hover:before{opacity:1}
  .lb-row .go{color:var(--muted-foreground);font-size:15px;transition:transform .25s;justify-self:end}
  .lb-row:hover .go{transform:translate(3px,-3px);color:var(--ink)}
  .lb-rank{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .lb-rank small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;margin-top:4px}
  .rk-up{color:var(--up)}.rk-dn{color:var(--down)}.rk-eq{color:var(--stable)}
  .lb-ph{width:62px;height:62px;border-radius:15px;overflow:hidden;flex:none}
  .lb-row:hover .lb-ph img{transform:scale(1.1)}
  .lb-name{min-width:0}
  .lb-name b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-name span{display:block;font-size:12px;color:var(--muted-foreground);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-name .mono{font-family:var(--mono);font-size:10.5px}
  .lb-gauge{min-width:0}
  .lb-gauge .track{height:8px;display:block}
  .lb-gauge .glab{display:flex;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:7px}
  .lb-val{text-align:right}
  .lb-val b{font-size:27px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1;font-variant-numeric:tabular-nums}
  .lb-val span{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);display:block;margin-top:5px}
  .lb-a{grid-template-columns:52px 62px minmax(140px,1.5fr) 145px 122px 16px}
  .lb-t{grid-template-columns:56px 62px minmax(150px,1.6fr) 118px 100px 130px 18px}
  .lb-r{grid-template-columns:46px 1fr 1.1fr 96px}
  .lb-p{grid-template-columns:76px 1.3fr 110px 150px 80px}
  .lb-foot{padding:13px 28px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted-foreground);background:var(--surface)}
  @media(max-width:960px){.lb-a{grid-template-columns:44px 52px 1fr 110px}.lb-t{grid-template-columns:44px 52px 1fr 110px}.lb-p{grid-template-columns:60px 1fr 110px}.hm{display:none!important}.lb-rank{font-size:24px}.lb-val b{font-size:22px}}

  /* Spotlight sticky */
  .spot{position:sticky;top:84px;border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;background:var(--card);transition:box-shadow .3s}
  .spot:hover{box-shadow:var(--shadow-hover)}
  .spot .ph{height:280px}
  .spot:hover .ph img{transform:scale(1.05)}
  .spot .body{padding:20px 24px 24px}
  .spot .body h3{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1}
  .spot .body .meta{font-size:12px;color:var(--muted-foreground);margin-top:4px}
  .spot .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:16px 0}
  .spot .stats .lab{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:6px}
  .spot .stats b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  footer.site .wrap{padding:32px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.2em;font-weight:600;flex-wrap:wrap;gap:12px}
  footer.site .np{font-weight:800;font-style:italic;font-size:15px;letter-spacing:-.04em;color:#fff}
  footer.site .foot-brand{display:inline-flex;align-items:center}
  footer.site .logo-mic-foot{height:18px;width:auto;display:block}

  .note-line{font-size:11.5px;color:var(--muted-foreground);display:flex;gap:8px;align-items:flex-start;margin-top:14px}
  .empty{padding:40px;text-align:center;color:var(--muted-foreground);font-size:13.5px}
  .placeholder-box{border:1px dashed #cfcecb;border-radius:var(--radius-card);padding:46px 34px;text-align:center;color:var(--muted-foreground);transition:border-color .25s, transform .25s}
  .placeholder-box:hover{border-color:var(--ink);transform:translateY(-3px)}

  /* ===== Couche copilot ===== */
  /* Hero compact et toggle retirés : les héros restent toujours déployés */

  /* ===== Hero dégradé page Artistes / Top roster ===== */
  .lab-hero{color:#fff;background:linear-gradient(135deg,#C8102E 0%,#0B0B0B 72%);position:relative;overflow:hidden}
  .lab-hero .wrap{padding:46px 32px 70px;display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center;min-height:420px}
  .lab-hero .kicker{margin:0 0 18px;color:rgba(255,255,255,.55);letter-spacing:.22em}
  .lab-hero h1{font-size:clamp(48px,7vw,92px);font-weight:800;letter-spacing:-.045em;line-height:.92}
  .lab-hero .lead{color:rgba(255,255,255,.72);font-size:15px;max-width:460px;margin-top:14px;line-height:1.5}
  .lab-hero .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .lab-hero .head-row{display:flex;align-items:flex-start;gap:16px}
  
  .lab-hero .ph{border-radius:var(--radius-card);aspect-ratio:1/1;max-height:400px;width:100%;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);display:block}
  .lab-hero .ph:hover img{transform:scale(1.045)}
  .lab-hero .btn-light{background:#fff;color:#0A0A0B}

  /* Barre de filtres claire page Artistes */
  .lab-filters{background:var(--background);border-bottom:1px solid var(--line)}
  .lab-filters .wrap{display:flex;align-items:center;gap:10px;padding:14px 32px;flex-wrap:wrap}
  .lab-filters .right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .lab-filters .hero-input{font-family:var(--font);font-size:13px;border:1px solid var(--line);border-radius:9999px;padding:9px 17px;outline:none;background:var(--card);color:var(--foreground);width:210px;transition:.2s}
  .lab-filters .hero-input:focus{border-color:var(--ink)}

  /* Digest « ce qui a changé » carte blanche */
  .changed-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px 28px;margin-bottom:26px;position:relative;overflow:hidden}
  .changed-card::before{content:"";position:absolute;inset:0;background:color-mix(in srgb, var(--pop) 4%, transparent);pointer-events:none}
  .changed-card > *{position:relative;z-index:1}
  .changed-card .kicker{margin:0 0 14px}
  .changed-card ul{list-style:none;display:grid;gap:14px}
  .changed-card li{display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;color:var(--foreground)}
  .changed-card li i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:800;flex:none;background:var(--muted)}
  .changed-card li a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  @media(max-width:960px){
    .lab-hero .wrap{grid-template-columns:1fr;padding:30px 20px 44px;gap:26px;min-height:0}
    .lab-filters .wrap{padding:14px 20px}
    .lab-filters .right{margin-left:0;width:100%}
    .lab-filters .hero-input{flex:1;width:auto;min-width:0}
    .changed-card{padding:20px}
  }

  .changed{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--card);padding:18px 22px;margin-bottom:18px}
  .changed ul{list-style:none;display:grid;gap:10px;margin-top:12px;padding:0}
  .changed li{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4}
  .changed li i{font-style:normal;flex:none}
  .changed a{color:inherit}
  .lb-head{display:grid;align-items:center;gap:18px;padding:11px 26px;border-bottom:1px solid var(--line);background:var(--surface)}
  .lb-head button,.lb-head span{font-family:var(--font);background:none;border:none;text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);padding:0}
  .lb-head button{cursor:pointer;transition:color .2s}
  .lb-head button:hover,.lb-head button.on{color:var(--ink)}
  .lb-head .r{text-align:right}
  .lb-a{grid-template-columns:52px 62px minmax(140px,1.5fr) 132px 150px 16px}
  .flagpill{display:inline-flex;width:max-content;align-self:flex-start;align-items:center;gap:3px;font-size:10px;font-weight:800;background:rgba(200,16,46,.09);color:#C8102E;border-radius:9999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .lb-name b{display:flex;align-items:center;flex-wrap:wrap}
  .lb-val .sub-d{font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;margin-top:5px;display:block}
  .crit{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;border-radius:9999px;padding:4px 9px;flex:none}
  .crit i{width:7px;height:7px;border-radius:50%;display:block;font-style:normal}
  .grp-lab{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground);margin:24px 0 10px}
  .grp-lab.first{margin-top:0}
  .digest{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--card);padding:20px 24px;margin-bottom:18px}
  .digest .row{display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .digest .row b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}
  .digest .row small{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground)}
  .alert-item.done{opacity:.45}
  .alert-item.done p{text-decoration:line-through}
  .a-act{background:none;border:1px solid var(--line);border-radius:9999px;font-family:var(--font);font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer;color:var(--muted-foreground);transition:.2s;flex:none}
  .a-act:hover{color:var(--ink);border-color:var(--ink)}
  .comp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
  .comp-row .st{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:9999px;padding:3px 9px;margin-left:auto;flex:none}
  .comp-row .st.ok{background:rgba(22,163,74,.1);color:#16A34A}
  .comp-row .st.ko{background:rgba(234,88,12,.12);color:#EA580C}
  .lnk{font-size:11.5px;font-weight:700;color:var(--muted-foreground);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--font);padding:0}
  .lnk:hover{color:var(--ink)}

  /* ===== Saisie manuelle ===== */
  .sai-band{background:#060606;color:#fff;min-height:56px;display:flex;align-items:center}
  .sai-band .wrap{display:flex;align-items:center;gap:14px;width:100%}
  .sai-band .kicker{color:rgba(255,255,255,.72);margin:0}
  
  .sai-tools{border-bottom:1px solid var(--line);background:var(--card)}
  .sai-tools .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
  .sai-tools .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .drop{border:1.5px dashed #cfcecb;background:var(--card);border-radius:26px;min-height:140px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:border-color .2s,background .2s,transform .2s}
  .drop.over{border-style:solid;border-color:var(--accent);background:rgba(245,29,49,.04)}
  .drop-head{display:flex;align-items:center;gap:12px}
  .drop-head .ic{width:40px;height:40px;border-radius:13px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .drop-head b{font-size:15px;letter-spacing:-.01em;display:block}
  .drop-head span{font-size:12.5px;color:var(--muted-foreground)}
  .sai-prompt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:9999px;padding:8px 8px 8px 18px;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:border-color .2s,box-shadow .2s}
  .sai-prompt:focus-within{border-color:var(--ink);box-shadow:0 8px 26px rgba(0,0,0,.08)}
  .sai-prompt input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--font);font-size:14.5px;color:var(--foreground)}
  .sai-ex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .sai-ex .ex{border:1px solid var(--line);background:var(--card);border-radius:9999px;padding:6px 13px;font-size:11.5px;font-weight:600;color:var(--muted-foreground);cursor:pointer;font-family:var(--font);transition:.2s}
  .sai-ex .ex:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-2px)}
  .prop{animation:propIn .32s cubic-bezier(.2,.7,.2,1) both;margin-top:16px}
  @keyframes propIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .prop .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .prop .p-head b{font-size:15px;letter-spacing:-.01em}
  .prop .src-txt{font-size:12px;font-style:italic;color:var(--muted-foreground);margin-top:6px}
  .prop .fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
  @media(max-width:820px){.prop .fgrid3{grid-template-columns:1fr}}
  .field.err input,.field.err select{border-color:#F51D31;box-shadow:0 0 0 3px rgba(245,29,49,.09)}
  .field input.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .csv-t{width:100%;border-collapse:collapse;font-size:13px}
  .csv-t th{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
  .csv-t td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .csv-t tr.warn td{background:rgba(234,88,12,.05)}
  .csv-t td.num{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
  .dup{background:rgba(234,88,12,.08);border:1px solid rgba(234,88,12,.3);color:#9A3412;border-radius:18px;padding:14px 16px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .hist-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);border-left:4px solid transparent;transition:background .18s,border-color .18s;flex-wrap:wrap}
  .hist-row:hover{background:#FAFAF9;border-left-color:var(--accent)}
  .hist-row .who{font-weight:700;font-size:13.5px}
  .hist-row .ref{font-size:11.5px;color:var(--muted-foreground)}
  .hist-row .v{margin-left:auto;text-align:right;flex:none}
  .hist-row .v b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1.1}
  .hist-row .v span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground)}
  .hist-row .meta{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
  .src-chip{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:9999px;padding:4px 9px;background:var(--muted);color:var(--muted-foreground);flex:none}
  .grp-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:700;transition:background .18s}
  .grp-row:hover{background:#FAFAF9}
  .sai-rail{position:sticky;top:88px}
  .prog{height:4px;border-radius:9999px;background:var(--muted);overflow:hidden;margin:10px 0 4px}
  .prog i{display:block;height:100%;background:var(--ink);border-radius:9999px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .sidepanel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:var(--card);border-left:1px solid var(--line);z-index:80;overflow:auto;padding:26px;box-shadow:-30px 0 90px -30px rgba(0,0,0,.35);animation:slideIn .3s cubic-bezier(.2,.7,.2,1) both}
  @keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

  /* ===== Accueil / Ask ===== */
  .ask-wrap{max-width:780px;margin:0 auto;padding:clamp(48px,9vh,110px) 24px 90px}
  .ask-mark{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-foreground);text-align:center}

function barsWeekly(data, color, labels=[], w=520, h=150){

function sparkMini(data, color, w=110, h=38){
  const min = Math.min(...data)*0.92, max = Math.max(...data)*1.04;
  const pts = data.map((v,i) => [3 + i*(w-6)/(data.length-1), h-4 - (v-min)/(max-min)*(h-9)]);
  const line = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">

const PERIODES = { '1 sem': {mult:1, lab:'1 sem', pts:7}, '1 mois': {mult:4, lab:'1 mois', pts:4}, '3 mois': {mult:12, lab:'3 mois', pts:12} };
const PAYS_FALLBACK = { Monde:100, FR:62, BE:7, CH:5 };
const AF = { periode:'1 sem', dsp:'Tous', pays:'Monde' };
const afDefault = () => AF.periode === '1 sem' && AF.dsp === 'Tous' && AF.pays === 'Monde';

function paysShare(a){
  if (AF.pays === 'Monde') return 1;
  const row = (a && a.demo && a.demo.pays || []).find(([p]) => p.toUpperCase().startsWith(AF.pays));
  return ((row ? row[1] : PAYS_FALLBACK[AF.pays]) || 0) / 100;
}
function dspShare(t){
  if (AF.dsp === 'Tous') return 1;
  return ((t && t.dsp && t.dsp[AF.dsp]) || 0) / 100;
}
/** Facteur appliqué aux volumes de streams selon les filtres actifs. */
function afFactor(a, t){ return PERIODES[AF.periode].mult * paysShare(a) * dspShare(t || (a && a.titres[0])); }

/* Séries temporelles cohérentes : 7 points journaliers, 4 semaines ou 12 semaines. */
function weeklyHistory(entity){
  const source = entity.cadence ? [...entity.cadence] : serieOf(entity);
  const latest = (entity.streamsHebdo || entity.streams || 0) / 1000;
  const scale = latest && source[source.length-1] ? latest / source[source.length-1] : 1;
  const known = source.map(v => v * scale);
  const ratio = known[1] ? Math.max(.82, Math.min(1.18, known[1] / known[0])) : 1.02;
  const older = [];
  let cursor = known[0] || latest;
  for(let i=0;i<Math.max(0,12-known.length);i++){
    cursor = cursor / ratio * (i % 2 ? 1.012 : .994);
    older.unshift(cursor);
  }
  return [...older, ...known].slice(-12);
}
function periodSeries(a, entity){
  const weekly = weeklyHistory(entity);
  let values, labels;
  if(AF.periode === '1 sem'){
    const latest = weekly[weekly.length-1] * 1000;
    const trend = Math.max(-.18, Math.min(.18, (entity.delta || a.delta || 0) / 100));
    const weights = [.135,.14,.125,.14,.145,.15,.165].map((v,i) => v * (1 + trend * (i-3)/3));
    const sum = weights.reduce((s,v) => s+v,0);
    values = weights.map(v => latest * v / sum);
    labels = ['Ven','Sam','Dim','Lun','Mar','Mer','Jeu'];
  } else if(AF.periode === '1 mois'){
    values = weekly.slice(-4).map(v => v * 1000);
    labels = Array.from({length:4},(_,i) => `S${SEMAINE.num-3+i}`);
  } else {
    values = weekly.map(v => v * 1000);
    labels = Array.from({length:12},(_,i) => `S${SEMAINE.num-11+i}`);
  }
  const dspFactor = AF.dsp === 'Tous' ? 1 : (entity.cadence ? dspShare(entity) : ((dspMix(a)[AF.dsp] || 0) / 100));
  const factor = paysShare(a) * dspFactor;
  return { values:values.map(v => Math.round(v*factor)), labels, total:Math.round(values.reduce((s,v)=>s+v,0)*factor) };
}
function periodDelta(entity){
  const w = weeklyHistory(entity);
  if(AF.periode === '1 sem') return entity.delta || 0;
  const recent = w.slice(-4).reduce((s,v)=>s+v,0);
  const prior = AF.periode === '1 mois' ? w.slice(-8,-4).reduce((s,v)=>s+v,0) : w.slice(0,4).reduce((s,v)=>s+v,0);
  return prior ? Math.round((recent/prior-1)*1000)/10 : entity.delta || 0;
}

/* ---- Cohérence des métriques non-streaming avec les filtres ---- */
const DSP_AUD_DELTA = { Spotify:0, Apple:-1.1, Deezer:0.8, Amazon:-1.9 };
/** Mix DSP moyen de l'artiste (pondéré par les streams de ses titres). */
function dspMix(a){
  const mix = {}; let tot = 0;
  (a && a.titres || []).forEach(t => {
    const w = t.streamsHebdo || 1; tot += w;
    Object.entries(t.dsp || {}).forEach(([d,p]) => { mix[d] = (mix[d] || 0) + p * w; });
  });
  Object.keys(mix).forEach(d => mix[d] = mix[d] / (tot || 1));
  return Object.keys(mix).length ? mix : { Spotify:100 };
}
/**
 * Auditeurs mensuels estimés sur le périmètre courant.
 * Base = auditeurs Spotify réels ; les autres DSP sont estimés via le mix de streams.
 * (métrique mensuelle : indépendante de la période, mais sensible au DSP et au pays)
 */
function audience(a){
  const mix = dspMix(a);
  const sp = (mix.Spotify || 100) / 100;
  const base = (a.listeners || 0) / (sp || 1);      // audience toutes plateformes (reach brut)
  const geo = paysShare(a);
  if (AF.dsp === 'Tous') return { val: Math.round(base * 0.86 * geo), delta: a.listenersDelta, lab: 'Tous DSP', est: true };
  if (AF.dsp === 'Spotify') return { val: Math.round(a.listeners * geo), delta: a.listenersDelta, lab: 'Spotify', est: false };
  const share = (mix[AF.dsp] || 0) / 100;
  return {
    val: Math.round(base * share * geo),
    delta: Math.round((a.listenersDelta + (DSP_AUD_DELTA[AF.dsp] || 0)) * 10) / 10,
    lab: AF.dsp, est: true,
  };
}
/** Volumes journaliers (Shazam, diffusions) : sensibles au pays, pas au DSP. */
const perDay = (v, a) => Math.max(1, Math.round((v || 0) * paysShare(a)));
/** Répartition des sources estimée selon le DSP sélectionné ; stable sur la période. */
function filteredSources(t){
  const shift = { Spotify:3, Apple:-4, Deezer:-2, Amazon:-6 }[AF.dsp] || 0;
  const active = Math.max(8, Math.min(92, Math.round((t.sources.actives || 0) + shift)));
  return { actives:active, passives:100-active, est:AF.dsp !== 'Tous' };
}

let rosterQuery = '', sortKey = 'streams', spotId = null;
const MES_ARTISTES = ['zazie','hina','jeremy-frerot'];
const alertDone = {};
function hero(short, kicker, title, lead, extra=''){
  return `<section class="band dark" style="padding:60px 0"><div class="wrap">

const alertsOf = id => ALERTES.filter(al => al.artiste === id && !alertDone[al.id]);
const serieOf = a => a.titres[0].cadence.map((_, i) => a.titres.reduce((s, t) => s + (t.cadence[i] || 0), 0));
const shazamOf = a => a.titres.reduce((s, t) => s + t.shazamJour, 0);
const ranked = () => [...ARTISTS].sort((x,y) => y.streams - x.streams);
const sorted = () => {
  const l = [...ARTISTS];
  if (sortKey === 'delta') return l.sort((x,y) => y.delta - x.delta);
  if (sortKey === 'shazam') return l.sort((x,y) => shazamOf(y) - shazamOf(x));
  if (sortKey === 'alertes') return l.sort((x,y) => alertsOf(y.id).length - alertsOf(x.id).length);
  return l.sort((x,y) => y.streams - x.streams);
};
function setSort(k){ sortKey = k; renderRosterOnly(); }
function whatChanged(){
  const mover = [...ARTISTS].sort((x,y) => y.delta - x.delta)[0];
  const drop = [...ARTISTS].sort((x,y) => x.delta - y.delta)[0];
  const shaz = ARTISTS.flatMap(a => a.titres.map(t => ({a,t}))).sort((x,y) => y.t.shazamJour - x.t.shazamJour)[0];
  const pl = ALERTES.filter(al => al.cat === 'PLAYLIST ÉDITO').length;
  const f = [];
  f.push([`<i style="color:var(--up);background:rgba(22,163,74,.1)">▲</i>`, `<b>${mover.nom}</b> est le plus fort mouvement de la semaine : <b>+${mover.delta}%</b> de streams (S${SEMAINE.num} vs S${SEMAINE.num-1}). <a href="#/artiste/${mover.id}">Ouvrir ↗</a>`]);
  if (drop.delta < 0) f.push([`<i style="color:var(--down);background:rgba(234,88,12,.1)">▼</i>`, `<b>${drop.nom}</b> recule de <b>${drop.delta}%</b> seuil d'alerte ${Math.abs(drop.delta) >= SEUILS.streaming ? 'franchi' : 'non franchi'}. <a href="#/artiste/${drop.id}">Ouvrir ↗</a>`]);
  f.push([`<i style="color:#C8102E;background:rgba(200,16,46,.1)">⚑</i>`, `<b>${shaz.t.shazamJour} Shazams/jour</b> sur « ${shaz.t.titre} » (${shaz.a.nom}) et <b>${pl} mouvement${pl>1?'s':''} de playlist édito</b> depuis vendredi. <a href="#/alertes">Voir les alertes ↗</a>`]);
  return `<div class="changed-card rv">
    <div class="kicker"><span class="dot"></span>CE QUI A CHANGÉ DEPUIS VENDREDI · S${SEMAINE.num}</div>
    <ul>${f.map(([i, t]) => `<li>${i}<span>${t}</span></li>`).join('')}</ul>
  </div>`;
}
/* ===== Accueil : question libre (RAG) ===== */
const askCard = (a, val, color, detail) => `<a class="ask-card" href="#/artiste/${a.id}">${coverPh(a, a.titres[0].isrc)}<div class="txt"><b>${a.nom}</b><span>${detail}</span></div><span class="val" style="color:${color}">${val}</span></a>`;
const ASKS = [
  { q: 'Quel artiste accélère cette semaine ?', run(){
      const l = [...ARTISTS].sort((x,y) => y.delta - x.delta).slice(0,4);
      return { txt: `Sur la semaine ${SEMAINE.num} (${SEMAINE.du} → ${SEMAINE.au}), <b>${l[0].nom}</b> signe la plus forte accélération du roster avec <b>+${l[0].delta}%</b> de streams. Le seuil d'alerte interne est fixé à ±${SEUILS.streaming}%.`,
        cards: l.map(a => askCard(a, (a.delta>0?'+':'')+a.delta+'%', a.delta>=0?'var(--up)':'var(--down)', `${fmt(a.streams)} streams · ${a.label}`)),
        src: ['Spotify', 'Believe', 'Shazam'] };
    }},
  { q: 'Qui recule et pourquoi ?', run(){
      const l = [...ARTISTS].sort((x,y) => x.delta - y.delta).filter(a => a.delta < 0).slice(0,4);
      if (!l.length) return { txt: 'Aucun artiste du roster n\'est en recul cette semaine.', cards: [], src: ['Believe'] };
      return { txt: `<b>${l.length} artiste${l.length>1?'s':''}</b> en repli cette semaine. Le plus marqué : <b>${l[0].nom}</b> à <b>${l[0].delta}%</b> ${Math.abs(l[0].delta) >= SEUILS.streaming ? 'seuil d\'alerte franchi, arbitrage à prévoir' : 'sous le seuil d\'alerte, à surveiller'}.`,
        cards: l.map(a => askCard(a, a.delta+'%', 'var(--down)', `${fmt(a.streams)} streams · ${a.label}`)),
        src: ['Believe', 'Spotify'] };
    }},
  { q: 'Quel titre est le plus shazamé ?', run(){
      const l = ARTISTS.flatMap(a => a.titres.map(t => ({a,t}))).sort((x,y) => y.t.shazamJour - x.t.shazamJour).slice(0,4);
      return { txt: `« <b>${l[0].t.titre}</b> » (${l[0].a.nom}) domine les Shazams avec <b>${l[0].t.shazamJour}/jour</b>. Le seuil de détection virale est à ${SEUILS.shazam} Shazams/jour.`,
        cards: l.map(({a,t}) => `<a class="ask-card" href="#/titre/${t.isrc}">${coverPh(a, t.isrc)}<div class="txt"><b>${t.titre}</b><span>${a.nom} · ${t.isrc}</span></div><span class="val" style="color:${t.shazamJour >= SEUILS.shazam ? 'var(--up)' : 'var(--ink)'}">${t.shazamJour}/j</span></a>`),
        src: ['Shazam', 'TikTok'] };
    }},
  { q: 'Que dois-je traiter en priorité ?', run(){
      const open = ALERTES.filter(al => !alertDone[al.id]);
      const crit = open.filter(al => critOf(al) === 'critique');
      return { txt: `<b>${open.length} alerte${open.length>1?'s':''} ouverte${open.length>1?'s':''}</b>, dont <b>${crit.length}</b> à traiter en priorité. <a href="#/alertes">Ouvrir le centre d'alertes ↗</a>`,
        cards: open.slice(0,4).map(al => { const a = artist(al.artiste); return a ? askCard(a, al.cat, 'var(--muted-foreground)', al.txt ? String(al.txt).replace(/<[^>]+>/g,'').slice(0,60) : al.cat) : ''; }).filter(Boolean),
        src: ['Alertes #NP'] };
    }},
  { q: 'Résume-moi la semaine du label', run(){
      const top = ranked()[0], mover = [...ARTISTS].sort((x,y) => y.delta - x.delta)[0];
      const tot = ARTISTS.reduce((s,a) => s + a.streams, 0);
      return { txt: `Semaine ${SEMAINE.num} : <b>${fmt(tot)} streams</b> cumulés sur ${ARTISTS.length} artistes. <b>${top.nom}</b> reste en tête du roster, <b>${mover.nom}</b> est la plus forte progression (+${mover.delta}%).`,
        cards: ranked().slice(0,4).map(a => askCard(a, fmt(a.streams), 'var(--ink)', `${(a.delta>0?'+':'')+a.delta}% · ${a.label}`)),
        src: ['Believe', 'Spotify', 'Saisies #NP'] };
    }},
];
let askState = null;
function askRun(q){
  const found = ASKS.find(x => x.q.toLowerCase() === q.toLowerCase()) ||
    ASKS.find(x => q.toLowerCase().split(/\s+/).filter(w => w.length > 4).some(w => x.q.toLowerCase().includes(w)));
  const a = artist(q.toLowerCase().trim()) || ARTISTS.find(a => q.toLowerCase().includes(a.nom.toLowerCase()));
  let res;
  if (a) res = { txt: `<b>${a.nom}</b> (${a.label}) <b>${fmt(a.streams)} streams</b> sur S${SEMAINE.num}, ${(a.delta>0?'+':'')+a.delta}% vs S${SEMAINE.num-1}, ${shazamOf(a)} Shazams/jour cumulés. <a href="#/artiste/${a.id}">Ouvrir la fiche ↗</a>`,
    cards: [askCard(a, (a.delta>0?'+':'')+a.delta+'%', a.delta>=0?'var(--up)':'var(--down)', `${fmt(a.streams)} streams · ${a.genre}`)], src: ['Believe', 'Spotify', 'Shazam'] };
  else if (found) res = found.run();
  else res = ASKS[4].run();
  askState = { q, ...res };
  render();
}
function askSubmit(e){
  e.preventDefault();
  const i = $('#ask-input');
  if (i && i.value.trim()) askRun(i.value.trim());
  return false;
}

function rosterRows(){
  const all = ranked();

  const rows = list.map(a => {
    const rank = all.indexOf(a) + 1;
    const nA = alertsOf(a.id).length;
    const col = a.delta >= SEUILS.streaming ? 'var(--up)' : a.delta <= -SEUILS.streaming ? 'var(--down)' : a.delta > 0 ? 'var(--up)' : a.delta < 0 ? 'var(--down)' : 'var(--stable)';

let saisieTab = 'physique', editIdx = -1;
const SEM_OPTS = ['S31','S30','S29','S28'];
const TYPES_PHY = ['Mise en place','Magasins','D2C'];
const TYPES_ACT = ['Date média','Lancement publicitaire','Sortie prévue'];
const UNITS_PHY = ['unités distribuées','unités vendues'];
const UNITS_ACT = ['€ (budget)','date (JJ/MM/AAAA)'];
let saiText = '', saiFocus = false, saiDragOver = false, panelOpen = false;
let PROP = null, DUP = null;

const typesOf = () => saisieTab === 'physique' ? TYPES_PHY : TYPES_ACT;
const unitsOf = () => saisieTab === 'physique' ? UNITS_PHY : UNITS_ACT;
const saiPrefix = () => saisieTab === 'physique' ? 'Physique ' : 'Actu ';

function projetsDe(nom){
  const a = ARTISTS.find(x => x.nom === nom);
  if (!a) return [];
  const out = [];
  const seen = new Set();
  a.titres.forEach(t => {
    if (!seen.has(t.projet)) { seen.add(t.projet); out.push([`${t.projet} UPC ${t.upc}`, `${t.projet} (UPC ${t.upc})`]); }
    out.push([`Titre « ${t.titre} » ISRC ${t.isrc}`, `« ${t.titre} » (ISRC ${t.isrc})`]);
  });
  return out;
}
function rattachOptions(nom, sel=''){
  return projetsDe(nom).map(([lab,val]) => `<option value="${val}"${val===sel?' selected':''}>${lab}</option>`).join('')
    + `<option value="__autre"${sel==='__autre'?' selected':''}>Autre enseigne / réseau</option>`;
}
function renderRattach(){
  const el = $('#f-rattach-wrap'); if (!el) return;
  el.innerHTML = rattachHtml($('#f-artiste').value);
}
function rattachHtml(nom, sel=''){
  return `<select id="f-rattach" onchange="$('#f-ref-other').style.display=this.value==='__autre'?'block':'none'">${rattachOptions(nom, sel)}</select>
    <input id="f-ref-other" placeholder="ex : FNAC (national)" style="display:none;margin-top:8px">`;
}

/* ---------- Interprétation par règles (aucun LLM) ---------- */
function saiParse(txt){
  const t = txt.trim(), low = t.toLowerCase();
  const a = ARTISTS.find(x => low.includes(x.nom.toLowerCase()))
    || ARTISTS.find(x => low.includes(x.nom.split(' ')[0].toLowerCase()));
  const semM = low.match(/s(\d{2})\b/);
  const dateM = t.match(/(\d{2}\/\d{2}\/\d{4}|\d{2}\/\d{2})/);
  const numM = low.replace(/s\d{2}\b/g,'').replace(/(\d)[\s.](?=\d{3}\b)/g,'$1').match(/\d{2,}/);
  let type = null;
  if (saisieTab === 'physique'){
    if (/mises? en place|distribu/.test(low)) type = 'Mise en place';
    else if (/d2c|direct|shop|site officiel/.test(low)) type = 'D2C';
    else if (/fnac|cultura|magasins?|ventes?|vendu/.test(low)) type = 'Magasins';
  } else {
    if (/interview|média|media|tv|radio|presse|tmc/.test(low)) type = 'Date média';
    else if (/pub|ads|campagne|budget|activation/.test(low)) type = 'Lancement publicitaire';
    else if (/sortie|single|album|ep\b|feat/.test(low)) type = 'Sortie prévue';
  }
  const enseigne = /fnac/.test(low) ? 'FNAC (national)' : (/cultura/.test(low) ? 'Cultura (national)' : (/d2c|shop/.test(low) ? 'Shop officiel' : ''));
  const projets = a ? projetsDe(a.nom) : [];
  const isDate = saisieTab === 'actus' && !!dateM;
  const qty = isDate ? dateM[1] : (numM ? numM[0] : '');
  const known = [a, type, qty].filter(Boolean).length;
  return {
    kind:'text',
    artiste: a ? a.nom : '',
    type: type || '',
    ref: enseigne || (projets[0] ? projets[0][1] : ''),
    qty,
    isDate,
    unit: isDate ? 'date (JJ/MM/AAAA)' : unitsOf()[0],
    sem: semM ? 'S' + semM[1] : 'S' + SEMAINE.num,
    conf: known === 3 ? 'haute' : 'moyenne',
    srcTxt: t,
  };
}
function saiSetText(v){ saiText = v; }
function saiExample(txt){ saiText = txt; saiFocus = true; saiAdd(); }
function saiPrefill(nom){
  saisieTab = 'physique';
  saiText = `Mise en place · ${nom} · S${SEMAINE.num} : `;
  saiFocus = true; PROP = null; DUP = null; render();
}
function saiAdd(){
  const txt = (saiText || '').trim();
  if (!txt){ toast('⚠&nbsp; Écrivez une saisie ou déposez un fichier'); return; }
  PROP = saiParse(txt); DUP = null;
  render();
  setTimeout(() => { const el = $('#prop-card'); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
}
function saiDrag(e, over){ e.preventDefault(); if (saiDragOver === over) return; saiDragOver = over; const z = $('#sai-drop'); if (z) z.classList.toggle('over', over); }
function saiDrop(e){

}

function saiFile(input){

function saiCsv(name = 'fnac_s31.csv'){
  PROP = { kind:'csv', file:name, rows:[

}
function saiPdf(name){ PROP = { kind:'pdf', file:name }; DUP = null; render(); }
function saiReject(){ PROP = null; DUP = null; toast('✕&nbsp; Proposition rejetée rien n\'a été intégré'); render(); }

function saiPropField(id){ const el = $('#' + id); return el ? el.value : ''; }
function saiPropRattach(){
  const nom = saiPropField('p-artiste');
  const w = $('#p-rattach'); if (w) w.innerHTML = rattachOptions(nom);
}
function saiValidate(){
  const artiste = saiPropField('p-artiste'), type = saiPropField('p-type');
  const qty = saiPropField('p-qty'), unit = saiPropField('p-unit'), sem = saiPropField('p-sem');
  let ref = saiPropField('p-rattach');
  if (!artiste || !type || !qty){ toast('⚠&nbsp; Complétez les champs « à préciser »'); PROP.miss = true; render(); return; }
  if (ref === '__autre' || !ref) ref = PROP.ref || '';
  const isDate = /date/.test(unit) || /\d{2}\/\d{2}/.test(qty);
  const num = isDate ? qty : (parseInt(String(qty).replace(/\D/g,''), 10) || 0).toLocaleString('fr-FR');
  const rec = { type: saiPrefix() + type, artiste, ref, val: isDate ? num : `${num} ${unit.split(' (')[0]}`, sem, date:'31/07/2026', par:'MC', src:'TEXTE' };
  saiCommit(rec);
}
function saiCommit(rec){
  const idx = SAISIES.findIndex(s => s.type === rec.type && s.artiste === rec.artiste && s.sem === rec.sem);
  if (idx >= 0){ DUP = { rec, idx }; render(); return; }
  SAISIES.unshift(rec); PROP = null; DUP = null; saiText = '';
  toast(`✓&nbsp; Intégré <b>${rec.type.split(' ')[1]} · ${rec.artiste} · ${rec.sem}</b>`);
  render();
}
function dupResolve(mode){
  if (!DUP) return;
  const { rec, idx } = DUP;
  if (mode === 'annuler'){ DUP = null; toast('↩&nbsp; Validation annulée'); render(); return; }
  if (mode === 'remplacer'){ rec.modif = '31/07/2026 · MC'; SAISIES.splice(idx, 1); }
  SAISIES.unshift(rec);
  DUP = null; PROP = null; saiText = '';
  toast(`✓&nbsp; Intégré <b>${rec.type.split(' ')[1]} · ${rec.artiste} · ${rec.sem}</b>`);
  render();
}
function csvToggle(i){ PROP.rows[i].sel = !PROP.rows[i].sel; render(); }
function csvAssoc(i, nom){
  PROP.rows[i].artiste = nom;
  PROP.rows[i].ok = !!nom;
  PROP.rows[i].sel = !!nom;
  render();
}
function csvValidate(){
  const rows = PROP.rows.filter(r => r.sel && r.ok);
  if (!rows.length){ toast('⚠&nbsp; Aucune ligne valide sélectionnée'); return; }
  const file = PROP.file;
  rows.slice().reverse().forEach(r => SAISIES.unshift({
    type:'Physique ' + r.type, artiste:r.artiste, ref:r.ref,
    val:`${r.qty.toLocaleString('fr-FR')} unités vendues`, sem:r.sem,
    date:'31/07/2026', par:'MC', src:'CSV', file,
  }));
  PROP = null;
  toast(`✓&nbsp; Intégré <b>${rows.length} ligne${rows.length>1?'s':''} de ${file}</b>`);
  render();
}
function csvRejectSel(){
  PROP.rows = PROP.rows.filter(r => !r.sel);
  if (!PROP.rows.length){ PROP = null; toast('✕&nbsp; Import rejeté'); }
  else toast('✕&nbsp; Lignes rejetées');
  render();
}

      <table class="csv-t">

        ${PROP.rows.map((r, i) => `<tr class="${r.ok ? '' : 'warn'}">
          <td><input type="checkbox" ${r.sel?'checked':''} ${r.ok?'':'disabled'} onchange="csvToggle(${i})"></td>
          <td style="font-weight:700">${r.ok ? r.artiste : `<div style="color:#EA580C;font-size:11.5px;margin-bottom:5px">⚠ « ${r.raw} » inconnu</div>
            <select onchange="csvAssoc(${i}, this.value)" style="font-family:var(--font);font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:7px 9px">
              <option value="">Associer à un artiste…</option>${ARTISTS.map(a => `<option>${a.nom}</option>`).join('')}</select>`}</td>
          <td>${r.type}</td><td style="font-size:12px;color:var(--muted-foreground)">${r.ref}</td>
          <td class="num">${r.qty.toLocaleString('fr-FR')}</td><td style="font-weight:700">${r.sem}</td>
        </tr>`).join('')}
      </table></div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-dark btn-sm" onclick="csvValidate()">Tout valider (${ok})</button>
        <button class="btn btn-outline btn-sm" onclick="csvRejectSel()">Rejeter la sélection</button>
      </div>
      ${dupBanner()}
    </div>`;
  }
  const miss = k => PROP.miss && !PROP[k] ? ' err' : '';
  return `
  <div class="card prop" id="prop-card">
    <div class="p-head"><b>Proposition · à valider</b>
      <span class="badge" style="background:${PROP.conf==='haute'?'rgba(22,163,74,.09)':'rgba(234,88,12,.09)'};color:${PROP.conf==='haute'?'#16A34A':'#EA580C'}">Confiance : ${PROP.conf}</span></div>
    <div class="fgrid3">
      <div class="field${miss('type')}"><label>Type</label><select id="p-type">
        <option value="">À préciser</option>${typesOf().map(t => `<option${t===PROP.type?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field${miss('artiste')}"><label>Artiste</label><select id="p-artiste" onchange="saiPropRattach()">
        <option value="">À préciser</option>${ARTISTS.map(a => `<option${a.nom===PROP.artiste?' selected':''}>${a.nom}</option>`).join('')}</select></div>
      <div class="field"><label>Semaine</label><select id="p-sem">${SEM_OPTS.map(s => `<option${s===PROP.sem?' selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Rattachement projet / titre</label>
      <select id="p-rattach">${PROP.artiste ? rattachOptions(PROP.artiste, PROP.ref) : '<option value="">À préciser</option>'}</select></div>
    <div class="fgrid">
      <div class="field${miss('qty')}"><label>${PROP.isDate ? 'Date' : (saisieTab === 'physique' ? 'Quantité' : 'Valeur')}</label>
        <input id="p-qty" class="big" value="${PROP.qty}" placeholder="À préciser"></div>
      <div class="field"><label>Unité</label><select id="p-unit">${unitsOf().map(u => `<option${u===PROP.unit?' selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-dark btn-sm" onclick="saiValidate()">Valider ✓</button>
      <button class="btn btn-outline btn-sm" onclick="saiReject()">Rejeter</button>
    </div>
    <div class="src-txt">Source : « ${PROP.srcTxt} »</div>
    ${dupBanner()}
  </div>`;
}
function dupBanner(){
  if (!DUP) return '';
  const r = DUP.rec;
  return `<div class="dup"><b>Une valeur existe déjà pour ${r.type.split(' ')[1]} · ${r.artiste} · ${r.sem}</b>
    <span style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">
      <button class="btn btn-dark btn-sm" onclick="dupResolve('remplacer')">Remplacer</button>
      <button class="btn btn-outline btn-sm" onclick="dupResolve('deux')">Conserver les deux</button>
      <button class="lnk" onclick="dupResolve('annuler')">Annuler</button>
    </span></div>`;
}
function saiRail(){
  const attendu = ARTISTS.map(a => [a.nom, !!SAISIES.find(s => s.artiste === a.nom && s.sem === 'S' + SEMAINE.num && s.type.startsWith(saisieTab === 'physique' ? 'Physique' : 'Actu'))]);
  const faits = attendu.filter(([, d]) => d).length;
  const manquants = attendu.length - faits;
  return `<div class="card sai-rail">
    <div class="kicker">SAISIES ATTENDUES · S${SEMAINE.num}</div>
    <div style="font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:10px 0 0">${faits}/${attendu.length} saisies faites</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:${manquants?'#EA580C':'#16A34A'}">${manquants ? manquants + ' manquante' + (manquants>1?'s':'') : 'complet ✓'}</div>
    <div class="prog"><i style="width:${Math.round(faits/attendu.length*100)}%"></i></div>
    ${attendu.map(([nom, done]) => `<div class="comp-row"><span>${nom}</span><span class="st ${done?'ok':'ko'}">${done ? 'fait ✓' : 'manquant ⚠'}</span>
      ${done ? '' : `<button class="a-act" onclick="saiPrefill('${nom.replace(/'/g,"\\'")}')">Saisir</button>
      <button class="a-act" onclick="toast('🔔&nbsp; Relance envoyée à l\\'équipe <b>${nom.replace(/'/g,"\\'")}</b> par e-mail')">Relancer</button>`}</div>`).join('')}
  </div>`;
}
function sidePanel(){
  if (!panelOpen) return '';
  const first = editIdx >= 0 ? SAISIES[editIdx].artiste : ARTISTS[0].nom;
  return `<aside class="sidepanel">
    <div style="display:flex;align-items:center"><div class="kicker">${editIdx >= 0 ? 'MODIFIER LA SAISIE' : 'SAISIE DÉTAILLÉE'} ${saisieTab === 'physique' ? 'PHYSIQUE' : 'ACTU'}</div>
      <button class="lnk" style="margin-left:auto" onclick="panelOpen=false;editIdx=-1;render()">Fermer ✕</button></div>
    <div style="margin-top:20px">
      <div class="fgrid">
        <div class="field"><label>Type</label><select id="f-type">${typesOf().map(t => `<option>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Semaine concernée</label><select id="f-sem">${SEM_OPTS.map(s => `<option${s === 'S' + SEMAINE.num ? ' selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Artiste</label><select id="f-artiste" onchange="renderRattach()">${ARTISTS.map(a => `<option${a.nom===first?' selected':''}>${a.nom}</option>`).join('')}</select></div>
      <div class="field"><label>Rattachement projet / titre (UPC / ISRC)</label><div id="f-rattach-wrap">${rattachHtml(first)}</div></div>
      <div class="fgrid">
        <div class="field"><label>${saisieTab === 'physique' ? 'Quantité' : 'Valeur'}</label><input id="f-val" class="big" placeholder="${saisieTab === 'physique' ? '1200' : '8000'}"></div>
        <div class="field"><label>Unité</label><select id="f-unit">${unitsOf().map(u => `<option>${u}</option>`).join('')}</select></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-dark btn-sm" onclick="addSaisie()">${editIdx >= 0 ? 'Mettre à jour' : 'Enregistrer'}</button>
        <button class="btn btn-outline btn-sm" onclick="panelOpen=false;editIdx=-1;render()">Annuler</button>
      </div>
    </div>
  </aside>`;
}
function vSaisie(){
  document.documentElement.style.setProperty('--accent', '#F51D31');
  setTimeout(() => { const el = $('#sai-input'); if (el && saiFocus){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); saiFocus = false; } }, 30);
  const ph = saisieTab === 'physique'
    ? 'Écrivez une saisie (« Zazie 12 500 mises en place S31 ») ou déposez un CSV / PDF…'
    : 'Écrivez une actu (« Interview Zazie TMC 04/08 ») ou déposez un CSV / PDF…';
  const ex = saisieTab === 'physique'
    ? ['FNAC 2 300 ventes Frerot S31','Hina D2C 340 unités','Interview Zazie TMC 04/08']
    : ['Interview Zazie TMC 04/08','Campagne pub Hina 8 000 € S31','Sortie prévue EP Hina 18/09/2026'];
  return `
  <section class="sai-band"><div class="wrap">
    <div class="kicker"><span class="dot"></span>DONNÉES NON-API SAISIE MANUELLE</div>
  </div></section>
  <div class="sai-tools"><div class="wrap">
    <button class="chip ${saisieTab==='physique'?'active':''}" onclick="saisieTab='physique';PROP=null;DUP=null;editIdx=-1;render()">Ventes physiques · hebdo</button>
    <button class="chip ${saisieTab==='actus'?'active':''}" onclick="saisieTab='actus';PROP=null;DUP=null;editIdx=-1;render()">Actus à venir · continu</button>
    <div class="right">${syncHtml}</div>
  </div></div>
  <section class="band"><div class="wrap">
    <div class="grid g-main">
      <div style="min-width:0">
        <div class="drop" id="sai-drop" ondragover="saiDrag(event,true)" ondragleave="saiDrag(event,false)" ondrop="saiDrop(event)">
          <div class="drop-head" onclick="saiPick()" style="cursor:pointer">
            <span class="ic">⇪</span>
            <div><b>Déposez un CSV ou un PDF ou cliquez pour parcourir</b>
            <span>Rien n'entre en base sans validation : chaque ligne passe par une proposition.</span></div>
          </div>
          <input type="file" id="sai-file" accept=".csv,.pdf" style="display:none" onchange="saiFile(this)">
          <div class="sai-prompt">
            <input id="sai-input" value="${saiText.replace(/"/g,'&quot;')}" placeholder="${ph}" oninput="saiSetText(this.value)" onkeydown="if(event.key==='Enter'){saiSetText(this.value);saiAdd()}">
            <button class="btn btn-dark btn-sm" onclick="saiSetText($('#sai-input').value);saiAdd()">Ajouter <span class="ar">↗</span></button>
          </div>
        </div>
        <div class="sai-ex">
          ${ex.map(e => `<button class="ex" onclick="saiExample(&quot;${e}&quot;)">${e}</button>`).join('')}
          <button class="lnk" onclick="saiCsv()">Simuler un import CSV</button>
          <button class="lnk" onclick="toast('⬇&nbsp; Gabarit CSV téléchargé <b>gabarit-saisie-${saisieTab}.csv</b>')">Télécharger le gabarit CSV</button>
          <button class="lnk" onclick="panelOpen=true;render()">Saisie détaillée</button>
        </div>
        ${propCard()}
      </div>
      <div style="min-width:0">${saiRail()}</div>
    </div>
  </div></section>
  ${sidePanel()}`;
}
function editSaisie(i){
  editIdx = i; panelOpen = true; render();
  const s = SAISIES[i];
  const art = $('#f-artiste'); if (art) { art.value = s.artiste; renderRattach(); }
  const sem = $('#f-sem'); if (sem) sem.value = s.sem;
  const val = $('#f-val'); if (val) val.value = parseInt(String(s.val).replace(/\D/g,''), 10) || '';
  toast(`✎&nbsp; Édition <b>${s.artiste}</b>`);
}
function delSaisie(i){
  const s = SAISIES[i];
  SAISIES.splice(i, 1);
  if (editIdx === i) { editIdx = -1; panelOpen = false; }
  toast(`🗑&nbsp; Saisie supprimée <b>${s.artiste}</b> (trace conservée)`);
  render();
}
function addSaisie(){
  const type = saiPrefix() + $('#f-type').value;
  const rat = $('#f-rattach').value;
  const ref = rat === '__autre' ? ($('#f-ref-other').value || '') : rat;
  const raw = $('#f-val').value.trim();
  const isDate = /\d{2}\/\d{2}/.test(raw);
  const n = parseInt(raw.replace(/\D/g,''), 10);
  if (!isDate && isNaN(n)) { toast('⚠&nbsp; Valeur requise'); return; }
  const val = isDate ? raw : n.toLocaleString('fr-FR') + ' ' + $('#f-unit').value.split(' (')[0];
  const rec = { type, artiste:$('#f-artiste').value, ref, val, sem:$('#f-sem').value, date:'31/07/2026', par:'MC', src:'FORMULAIRE' };
  if (editIdx >= 0) { rec.modif = '31/07/2026 · MC'; SAISIES[editIdx] = rec; editIdx = -1; panelOpen = false; toast(`✓&nbsp; Saisie mise à jour <b>${rec.artiste}</b>`); render(); return; }
  panelOpen = false;
  saiCommit(rec);
}


/* ================================================================
   ROUTEUR + RÉVÉLATION AU SCROLL + SCROLL-SPY
================================================================ */
let rvObs, spyObs;
function observeRv(){
  if (rvObs) rvObs.disconnect();
  rvObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rvObs.unobserve(e.target); } }), {threshold:.12});
  document.querySelectorAll('.rv:not(.in)').forEach(el => rvObs.observe(el));
}
function observeSpy(){
  if (spyObs) spyObs.disconnect();
  const links = [...document.querySelectorAll('.subnav a[href^="#s-"]')];
  if (!links.length) return;
  spyObs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) {
      links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id));
    }});
  }, {rootMargin:'-30% 0px -60% 0px'});
  SECTIONS.forEach(([id2]) => { const el = document.getElementById('s-' + id2); if (el) spyObs.observe(el); });
}
/* ================= INTRO / LOGIN ================= */
let micAuth = false;
try { micAuth = sessionStorage.getItem('mic_auth') === '1'; } catch(e){}
function micLogin(ev){
  if (ev) ev.preventDefault();
  try { sessionStorage.setItem('mic_auth','1'); } catch(e){}
  micAuth = true;
  location.hash = '#/home';
  render();
  if (typeof toast === 'function') toast('Bienvenue sur #MIC mock');
  return false;
}
function micLogout(){
  try { sessionStorage.removeItem('mic_auth'); } catch(e){}
  micAuth = false;
  location.hash = '#/intro';
  render();
}
function vIntro(){
  const ph = k => IMGS[k];
  return `<section class="intro">
    <div class="intro-glow"></div>
    <div class="intro-float if1"><img src="${ph('zazie')}" alt=""></div>
    <div class="intro-float if2"><img src="${ph('krisy')}" alt=""></div>
    <div class="intro-float if3"><img src="${ph('jeremy-frerot')}" alt=""></div>
    <div class="intro-float if4"><img src="${ph('hina')}" alt=""></div>
    <div>
      <div class="intro-card">
        <a class="intro-logo" href="#/intro"><img src="/__l5e/assets-v1/edc626b7-3a66-45a2-946d-aedc2393da1e/MIC_LOGO.svg" alt="MIC"></a>
        <h1>Music Industry Copilot</h1>
        <p class="sub">Streaming, Shazam, alertes et saisies, toute la donnée du roster 6&amp;7 en un seul endroit.</p>
        <form class="intro-form" onsubmit="return micLogin(event)">
          <input type="email" placeholder="Adresse e-mail" value="margot.charrie@6et7.fr" autocomplete="email">
          <input type="password" placeholder="Mot de passe" value="••••••••" autocomplete="current-password">
          <button class="intro-cta" type="submit">Connexion</button>
        </form>
        <button class="intro-alt" onclick="micLogin()">Continuer en mode démo →</button>
      </div>
      <div class="intro-mention"><b>#MIC mock</b> Music Industry Copilot · pour le label 6&amp;7</div>
    </div>
  </section>`;
}
function render(){
  const nOpen = ALERTES.filter(al => !alertDone[al.id]).length;
  $('#nav-alert-count').textContent = nOpen;
  document.querySelectorAll('[data-alert-count]').forEach(el => el.textContent = nOpen || '');
  const h = location.hash || '#/home';
  const [, route, param, anchor] = h.split('/');
  const app = $('#app');
  document.querySelectorAll('nav.main a, .tabbar a').forEach(a => a.classList.toggle('active',
    a.dataset.r === route || (a.dataset.r === 'artistes' && (route === 'artiste' || route === 'titre'))));
  if (route === 'intro' || !micAuth) {
    document.body.classList.add('intro-mode');
    app.innerHTML = vIntro();
    window.scrollTo(0,0);
    return;
  }
  document.body.classList.remove('intro-mode');
  if (route === 'home') app.innerHTML = vHome();
  else if (route === 'artiste' && param) app.innerHTML = vArtiste(param);
  else if (route === 'titre' && param) app.innerHTML = vTitre(param);
  else if (route === 'alertes') app.innerHTML = vAlertes();
  else if (route === 'saisie') app.innerHTML = vSaisie();
  else { spotId = null; document.documentElement.style.setProperty('--accent', '#C8102E'); app.innerHTML = vArtistes(); }
  if (route === 'home' && askState) requestAnimationFrame(() => {
    const el = app.querySelector('.ask-answer');
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  });

  window.scrollTo(0, 0);
  observeRv();
  observeSpy();
  if (anchor) requestAnimationFrame(() => {
    const el = document.getElementById(anchor);
    if (el) { document.querySelectorAll('.rv:not(.in)').forEach(n => n.classList.add('in')); el.scrollIntoView({behavior:'smooth', block:'start'}); }
  });
}
window.addEventListener('hashchange', render);
render();
</script>
